services:
  cashflowjs:
    build: .
    container_name: cashflowjs-ru
    ports:
      - "127.0.0.1:12929:80"
    restart: unless-stopped

  cashflowjs-online:
    build:
      context: .
      dockerfile: Dockerfile.online
    container_name: cashflowjs-online
    ports:
      - "127.0.0.1:12930:12930"
    restart: unless-stopped
