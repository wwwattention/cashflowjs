# Cloudflare Tunnel config for CashFlowJs Russian deployment.
# Tunnel name: cashflow
# Tunnel UUID: 1662d16f-5d43-4a46-969f-240acbeafcf0
# Credentials are kept outside git at ~/.cloudflared/1662d16f-5d43-4a46-969f-240acbeafcf0.json

tunnel: 1662d16f-5d43-4a46-969f-240acbeafcf0
credentials-file: /etc/cloudflared/1662d16f-5d43-4a46-969f-240acbeafcf0.json

protocol: http2
edge-ip-version: "4"
no-autoupdate: true
loglevel: info
grace-period: 30s

ingress:
  - hostname: cashflow.perfect.surf
    service: http://host.docker.internal:12929
    originRequest:
      httpHostHeader: cashflow.perfect.surf
      connectTimeout: 30s
      http2Origin: false
  - service: http_status:404
